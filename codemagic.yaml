workflows:
  ios-proveit:
    name: Prove It iOS
    max_build_duration: 60
    environment:
      groups:
        - supabase_proveit
        - iOS_signing_proveit
      vars:
        BUNDLE_ID: "com.avocadopoker.proveit"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Disable export compliance prompt
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
      - name: Set build number (auto-increment)
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Set up keychain
        script: keychain initialize
      - name: Import certificate
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
      - name: Import provisioning profile
        script: |
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/proveit.mobileprovision"
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Family
